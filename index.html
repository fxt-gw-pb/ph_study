<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>大四下学期往年题整理</title>
  <link rel="stylesheet" href="tokens.css"/>
  <link rel="stylesheet" href="site.css"/>
  <!-- KaTeX (math rendering) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
</head>
<body>
  <!-- subject registry & helpers -->
  <script src="subjects.js"></script>
  <!-- existing occupational-health real data (assigns window.SITE_DATA) -->
  <script src="site-data.js"></script>
  <!-- placeholder data for subjects that do not yet have generated content -->
  <script src="subjects-data.js"></script>
  <!-- toxicology real data (assigns window.TOX_SITE_DATA) -->
  <script src="tox-data.js"></script>
  <!-- environmental-health real data (assigns window.ENV_SITE_DATA) -->
  <script src="env-data.js"></script>
  <!-- epidemiology real data (assigns window.EPI_SITE_DATA) -->
  <script src="epi-data.js"></script>
  <!-- main app -->
  <script src="site.js"></script>
  <!-- KaTeX auto-render: typeset $...$ / $...$ in dynamically rendered views -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    (function () {
      var opts = {
        delimiters: [
          { left: "$", right: "$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false }
        ],
        ignoredTags: ["script", "noscript", "style", "textarea"],
        throwOnError: false
      };
      var observer = null, pending = null;
      function typeset() {
        if (!window.renderMathInElement) return;
        if (observer) observer.disconnect();
        try { window.renderMathInElement(document.body, opts); } catch (e) {}
        if (observer) observer.observe(document.body, { childList: true, subtree: true });
      }
      function schedule() { clearTimeout(pending); pending = setTimeout(typeset, 60); }
      function start() {
        observer = new MutationObserver(schedule);
        observer.observe(document.body, { childList: true, subtree: true });
        var tries = 0;
        (function wait() {
          if (window.renderMathInElement) { typeset(); }
          else if (tries++ < 100) { setTimeout(wait, 50); }
        })();
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
  </script>
</body>
</html>
